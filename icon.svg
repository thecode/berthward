<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5273"/>
      <stop offset="1" stop-color="#0c2233"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc857" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc857" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc857" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc857" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- the light -->
    <polygon points="232,150 0,62 0,238" fill="url(#beamL)"/>
    <polygon points="280,150 512,62 512,238" fill="url(#beamR)"/>
    <!-- the tower -->
    <polygon points="214,190 298,190 330,404 182,404" fill="#f5f1e8"/>
    <polygon points="203.3,262 308.7,262 316.2,312 195.8,312" fill="#e2573f"/>
    <rect x="198" y="176" width="116" height="16" rx="5" fill="#f5f1e8"/>
    <rect x="224" y="118" width="64" height="58" rx="7" fill="#ffc857"/>
    <polygon points="212,120 300,120 256,76" fill="#f5f1e8"/>
    <path d="M241 404 v-34 a15 15 0 0 1 30 0 v34 z" fill="#0c2233"/>
    <rect x="164" y="398" width="184" height="18" rx="7" fill="#f5f1e8"/>
    <!-- the water -->
    <path d="M56 446 q25 -22 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#63bcd2" stroke-width="15" stroke-linecap="round"/>
    <path d="M106 484 q25 -20 50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#63bcd2" stroke-width="13" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
